[workspace]
resolver = "2"
members = [
    "crates/dhun-core",
    "crates/dhun-dsp",
    "crates/dhun-project",
    "crates/dhun-engine",
    "crates/dhun-io",
    "crates/dhun-cli",
    "crates/dhun-ui",
    "crates/dhun-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Saathwik Godela"]
repository = "https://github.com/saathwik/dhun"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates (path deps wired per SPEC §6 layering).
dhun-core = { path = "crates/dhun-core" }
dhun-dsp = { path = "crates/dhun-dsp" }
dhun-project = { path = "crates/dhun-project" }
dhun-engine = { path = "crates/dhun-engine" }
dhun-io = { path = "crates/dhun-io" }
dhun-ui = { path = "crates/dhun-ui" }

# External crates (SPEC §7). Pulled in by crates as milestones land.
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
anyhow = "1"
