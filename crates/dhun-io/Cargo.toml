[package]
name = "dhun-io"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dhun real-time audio device I/O (cpal) and transport messaging."

[dependencies]
dhun-core.workspace = true
dhun-engine.workspace = true
thiserror.workspace = true
rtrb.workspace = true
hound.workspace = true

# cpal drives real devices natively and the WebAudio backend on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }
