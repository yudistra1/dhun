[package]
name = "dhun-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dhun desktop app: wires the UI to the engine and audio I/O."

[[bin]]
name = "dhun-app"
path = "src/main.rs"

[dependencies]
dhun-ui.workspace = true
dhun-io.workspace = true
dhun-engine.workspace = true
eframe.workspace = true

# Web build: egui runs in the browser via WebAssembly (WebGL + WebAudio).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
